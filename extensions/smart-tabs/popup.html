<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rinswa Smart Tab Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Bar -->
    <header class="header">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 128 128" fill="none">
          <defs>
            <linearGradient id="logoRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#00f2fe"/>
              <stop offset="35%" stop-color="#0072ff"/>
              <stop offset="70%" stop-color="#a855f7"/>
              <stop offset="100%" stop-color="#ec4899"/>
            </linearGradient>
          </defs>
          <rect x="16" y="24" width="96" height="80" rx="16" fill="rgba(30,19,70,0.85)" stroke="#00f2fe" stroke-width="3"/>
          <rect x="28" y="88" width="72" height="6" rx="3" fill="url(#logoRibbon)"/>
          <circle cx="36" cy="46" r="5" fill="#00f2fe"/>
          <rect x="50" y="43" width="44" height="6" rx="3" fill="#ffffff"/>
          <circle cx="36" cy="66" r="5" fill="#a855f7"/>
          <rect x="50" y="63" width="34" height="6" rx="3" fill="#cbd5e1"/>
        </svg>
        <div class="brand-text">
          <div class="brand-title">RINSWA TABS</div>
          <div class="brand-subtitle">Smart Organizer & Cleaner</div>
        </div>
      </div>
      <div class="header-badges">
        <span id="badge-total-tabs" class="badge-pill">0 Tabs</span>
        <button id="btn-quick-sleep" class="btn-icon" title="Put Inactive Tabs to Sleep">💤</button>
      </div>
    </header>

    <!-- Search Omnibar -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="tab-search-input" placeholder="Search tabs by title, domain, or category..." autocomplete="off">
      <button id="search-clear-btn" class="search-clear" style="display:none;">✕</button>
    </div>

    <!-- Navigation Tabs (Clean Tabs / Groups / Workspaces) -->
    <nav class="nav-tabs">
      <button class="nav-tab active" data-tab="tab-cleaner">
        <span>⚡</span> Clean Tabs
      </button>
      <button class="nav-tab" data-tab="tab-groups">
        <span>📑</span> Groups
      </button>
      <button class="nav-tab" data-tab="tab-workspaces">
        <span>🗂️</span> Workspaces
      </button>
    </nav>

    <!-- View 1: Clean Tabs -->
    <main id="tab-cleaner" class="tab-view active">
      <!-- Signature "Clean Tabs" Card -->
      <section class="clean-card" id="clean-card">
        <div class="clean-card-header">
          <div class="clean-card-badge">INTELLIGENT AUDIT</div>
          <h2 class="clean-card-title" id="audit-main-title">Scanning open tabs...</h2>
        </div>
        
        <ul class="clean-insights-list" id="audit-insights-list">
          <!-- Dynamically populated -->
        </ul>

        <div class="clean-card-actions">
          <button id="btn-clean-auto" class="btn-primary-ribbon">
            <span class="btn-icon">⚡</span> Clean Automatically
          </button>
          <button id="btn-clean-review" class="btn-glass">
            <span class="btn-icon">📋</span> Review
          </button>
        </div>

        <div class="clean-status-message" id="clean-status-message" style="display:none;"></div>
      </section>

      <!-- Review Drawer (Expandable) -->
      <section class="review-drawer" id="review-drawer" style="display:none;">
        <div class="review-drawer-header">
          <h3>Review & Custom Clean</h3>
          <button id="btn-close-review" class="btn-icon-subtle">✕</button>
        </div>
        
        <div class="review-sections-wrap" id="review-sections-wrap">
          <!-- Populated by JS -->
        </div>

        <div class="review-drawer-footer">
          <button id="btn-apply-review" class="btn-primary-ribbon full-width">
            Apply Selected Actions
          </button>
        </div>
      </section>

      <!-- Quick Action Cards Row -->
      <div class="quick-cards-grid">
        <div class="quick-card" id="qc-group-strip">
          <div class="qc-icon">📁</div>
          <div class="qc-info">
            <div class="qc-title">Auto-Group Strip</div>
            <div class="qc-desc">Arrange related tabs contiguously</div>
          </div>
        </div>
        <div class="quick-card" id="qc-sleep-all">
          <div class="qc-icon">💤</div>
          <div class="qc-info">
            <div class="qc-title">Sleep Inactive</div>
            <div class="qc-desc">Hibernate tabs to drop memory</div>
          </div>
        </div>
      </div>
    </main>

    <!-- View 2: Tab Groups (Work, Shopping, Personal, Media) -->
    <main id="tab-groups" class="tab-view">
      <div class="groups-actions-bar">
        <button id="btn-group-all-now" class="btn-primary-small">⚡ Group Tabs Automatically</button>
        <span class="groups-count-tag" id="groups-count-tag">0 Categories</span>
      </div>

      <div class="groups-container" id="groups-container">
        <!-- Rendered by JS -->
      </div>
    </main>

    <!-- View 3: Workspaces (Save & Restore) -->
    <main id="tab-workspaces" class="tab-view">
      <div class="workspace-creator">
        <div class="ws-input-row">
          <input type="text" id="ws-name-input" placeholder="New workspace name (e.g. Work, Laravel, Shopping)...">
          <select id="ws-icon-select">
            <option value="💼">💼 Work</option>
            <option value="🛍️">🛍️ Shopping</option>
            <option value="💬">💬 Personal</option>
            <option value="📚">📚 Research</option>
            <option value="🎬">🎬 Media</option>
            <option value="🚀">🚀 Project</option>
          </select>
          <button id="btn-save-workspace" class="btn-primary-small">Save</button>
        </div>
      </div>

      <div class="workspaces-list" id="workspaces-list">
        <!-- Rendered by JS -->
      </div>
    </main>

    <!-- Search Results View (Overlays when typing search) -->
    <div id="search-results-overlay" class="search-overlay" style="display:none;">
      <div class="search-overlay-header">
        <span id="search-count-label">0 matching tabs</span>
      </div>
      <div class="search-list" id="search-list">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span class="footer-ram" id="footer-ram-stat">💾 Estimated Memory Saved: 0 MB</span>
      <span class="footer-brand">Rinswa Cyber-Glass</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
