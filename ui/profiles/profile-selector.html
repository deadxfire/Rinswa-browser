<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rinswa Profile Selector</title>
  <link rel="stylesheet" href="profile-selector.css">
</head>
<body>
  <div class="profile-container">
    <header class="profile-header">
      <h2>Switch Profile</h2>
    </header>

    <ul id="profile-list" class="profile-list">
      <!-- Populated dynamically via ProfileSelector.js -->
    </ul>

    <div class="profile-actions">
      <button id="btn-add-profile" class="action-btn primary">+ Add New Profile</button>
      <button id="btn-manage-profiles" class="action-btn secondary">Manage Profiles</button>
    </div>
  </div>
  <script src="ProfileSelector.js"></script>
</body>
</html>
